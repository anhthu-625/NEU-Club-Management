{% extends "base.html" %}

{% block title %}Chỉnh Sửa Sản Phẩm - Hệ thống CLB{% endblock %}

{% block page_title %}Chỉnh Sửa Sản Phẩm{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="page-title mb-0">
        <i class="fas fa-edit me-2"></i>Thay Đổi Thông Tin Món Hàng
    </h2>
    <a href="{{ url_for('club_products') }}" class="btn btn-outline-secondary">
        <i class="fas fa-times me-2"></i>Hủy Chỉnh Sửa
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-5">
                <form action="{{ url_for('edit_product', product_id=product.id) }}" method="POST">
                    <!-- Product Info -->
                    <div class="mb-4">
                        <label for="product_name" class="form-label fw-bold">Tên Sản Phẩm <span class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-lg" id="product_name" name="product_name" required value="{{ product.product_name }}">
                    </div>
                    
                    <div class="mb-4">
                        <label for="description" class="form-label fw-bold">Nội Dung Mô Tả</label>
                        <textarea class="form-control" id="description" name="description" rows="5">{{ product.description }}</textarea>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="price" class="form-label fw-bold">Đơn Giá Bán (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control form-control-lg" id="price" name="price" required min="1000" step="1" value="{{ product.price | int }}">
                        </div>
                        <div class="col-md-6">
                            <label for="quantity" class="form-label fw-bold">Số Lượng Kho Hàng</label>
                            <input type="number" class="form-control form-control-lg" id="quantity" name="quantity" min="0" value="{{ product.quantity }}">
                        </div>
                    </div>

                    <!-- Image URL Field -->
                     <div class="mb-4">
                        <label for="image_url" class="form-label fw-bold">Link Ảnh Bìa</label>
                        <input type="url" class="form-control" id="image_url" name="image_url" value="{{ product.image_url }}">
                        {% if product.image_url %}
                            <div class="mt-3">
                                <label class="text-muted small">Ảnh Hiện Tại:</label>
                                <img src="{{ product.image_url }}" alt="Preview" class="img-thumbnail mt-1" style="max-height: 150px; display: block; object-fit: cover;">
                            </div>
                        {% endif %}
                    </div>

                    <div class="d-grid mt-5">
                        <button type="submit" class="btn btn-primary btn-lg p-3" style="font-weight: 600;">
                            <i class="fas fa-save me-2"></i>Chốt Cập Nhật Thông Số
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
