{% extends "base.html" %}

{% block title %}Chỉnh Sửa Sự Kiện - Hệ thống CLB{% endblock %}

{% block page_title %}Chỉnh Sửa Sự Kiện{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="page-title mb-0">
        <i class="fas fa-edit me-2"></i>Chỉnh Sửa Sự Kiện
    </h2>
    <a href="{{ url_for('club_events') }}" class="btn btn-outline-secondary">
        <i class="fas fa-times me-2"></i>Trở Lại
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-5">
                <form action="{{ url_for('edit_event', event_id=event.id) }}" method="POST">
                    <div class="mb-4">
                        <label for="event_name" class="form-label fw-bold">Tên Sự Kiện <span class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-lg" id="event_name" name="event_name" required value="{{ event.event_name }}">
                    </div>
                    
                    <div class="mb-4">
                        <label for="description" class="form-label fw-bold">Mô Tả Nhanh</label>
                        <textarea class="form-control" id="description" name="description" rows="4">{{ event.description }}</textarea>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="start_date" class="form-label fw-bold">Thời gian diễn ra <span class="text-danger">*</span></label>
                            <input type="datetime-local" class="form-control form-control-lg" id="start_date" name="start_date" value="{{ event.start_date.strftime('%Y-%m-%dT%H:%M') }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="max_participants" class="form-label fw-bold">Số Lượng Người Tham Gia (Tối đa)</label>
                            <input type="number" class="form-control form-control-lg" id="max_participants" name="max_participants" min="0" value="{{ event.max_participants if event.max_participants else '' }}">
                            <small class="text-muted">Nhập trống hoặc 0 = Không giới hạn</small>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="location" class="form-label fw-bold">Địa Điểm <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-lg" id="location" name="location" required value="{{ event.location }}">
                        </div>
                        <div class="col-md-6">
                            <label for="achievement_points" class="form-label fw-bold">Điểm Đoàn thưởng <span class="text-primary">*</span></label>
                            <input type="number" class="form-control form-control-lg" id="achievement_points" name="achievement_points" min="1" max="100" value="{{ event.achievement_points or 5 }}" required>
                            <small class="text-muted">Số điểm cộng cho sinh viên sau khi hoàn thành.</small>
                        </div>
                    </div>

                    <div class="mt-5 d-flex gap-3">
                        <button type="submit" class="btn btn-primary btn-lg p-3 flex-grow-1" style="font-weight: 600;">
                            <i class="fas fa-save me-2"></i>Lưu Chỉnh Sửa
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
